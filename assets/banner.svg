<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#080e1a"/>
    </linearGradient>

    <!-- Vibrant Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="streamGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- CSS Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes streamFlowRight {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes streamFlowLeft {
        0% { stroke-dashoffset: -400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes nodePulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.3); opacity: 1; }
      }
      @keyframes memoryChunkDrift {
        0% { transform: translateX(0px); opacity: 0.2; }
        50% { opacity: 0.7; }
        100% { transform: translateX(360px); opacity: 0; }
      }

      .bg-pulse-1 {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: 250px 180px;
      }
      .bg-pulse-2 {
        animation: pulseGlow 10s ease-in-out infinite reverse;
        transform-origin: 950px 180px;
      }
      .stream-line-1 {
        stroke-dasharray: 20, 15;
        animation: streamFlowRight 12s linear infinite;
      }
      .stream-line-2 {
        stroke-dasharray: 16, 12;
        animation: streamFlowLeft 14s linear infinite;
      }
      .particle-pulse {
        animation: nodePulse 3s ease-in-out infinite;
      }
      .chunk-1 { animation: memoryChunkDrift 7s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .chunk-2 { animation: memoryChunkDrift 9s cubic-bezier(0.4, 0, 0.2, 1) infinite 2s; }
      .chunk-3 { animation: memoryChunkDrift 8s cubic-bezier(0.4, 0, 0.2, 1) infinite 4s; }
      
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.025em;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.015em;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Background Ambient Glow Orbs -->
  <circle class="bg-pulse-1" cx="220" cy="120" r="180" fill="url(#glowGrad)" filter="url(#glow)" />
  <circle class="bg-pulse-2" cx="980" cy="240" r="210" fill="url(#glowGrad)" filter="url(#glow)" />

  <!-- Animated Data Streams (Underneath Content) -->
  <g opacity="0.45">
    <path class="stream-line-1" d="M -50 80 Q 300 40, 600 90 T 1250 70" fill="none" stroke="url(#streamGrad1)" stroke-width="2.5" />
    <path class="stream-line-2" d="M -50 290 Q 350 330, 700 280 T 1250 300" fill="none" stroke="url(#streamGrad2)" stroke-width="2.5" />
    <path class="stream-line-1" d="M -30 190 C 250 140, 450 240, 800 170 S 1100 230, 1230 190" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.35" />
  </g>

  <!-- Drifting Out-of-Core Memory Chunks (Simulating RAM to Disk Spilling) -->
  <g opacity="0.6">
    <g class="chunk-1">
      <rect x="180" y="65" width="28" height="14" rx="4" fill="#38bdf8" fill-opacity="0.6" stroke="#0284c7" stroke-width="1"/>
    </g>
    <g class="chunk-2">
      <rect x="100" y="278" width="32" height="15" rx="4" fill="#a855f7" fill-opacity="0.6" stroke="#9333ea" stroke-width="1"/>
    </g>
    <g class="chunk-3">
      <rect x="680" y="55" width="24" height="12" rx="4" fill="#ec4899" fill-opacity="0.6" stroke="#db2777" stroke-width="1"/>
    </g>
  </g>

  <!-- Decorative Architectural Grid Points -->
  <g fill="#475569" opacity="0.3">
    <circle cx="80" cy="50" r="2" />
    <circle cx="120" cy="50" r="2" />
    <circle cx="160" cy="50" r="2" />
    <circle cx="1040" cy="50" r="2" />
    <circle cx="1080" cy="50" r="2" />
    <circle cx="1120" cy="50" r="2" />
    <circle cx="80" cy="310" r="2" />
    <circle cx="120" cy="310" r="2" />
    <circle cx="160" cy="310" r="2" />
    <circle cx="1040" cy="310" r="2" />
    <circle cx="1080" cy="310" r="2" />
    <circle cx="1120" cy="310" r="2" />
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed sharp and 100% visible -->
  
  <!-- Top Category Tag -->
  <g transform="translate(600, 52)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="-118" cy="0" r="5" fill="#38bdf8" class="particle-pulse" />
    <text text-anchor="middle" y="4.5" fill="#bae6fd" font-size="12" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-weight="700" letter-spacing="0.1em">CURATED DATA ECOSYSTEM</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(600, 138)">
    <text text-anchor="middle" class="title-text" font-size="46" fill="url(#titleGrad)" filter="url(#softGlow)">Awesome Out-Of-Core DataFrames</text>
    <text text-anchor="middle" class="title-text" font-size="46" fill="url(#titleGrad)">Awesome Out-Of-Core DataFrames</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 185)">
    <text text-anchor="middle" class="sub-text" font-size="18" fill="#94a3b8">
      Larger-Than-RAM Processing <tspan fill="#38bdf8">•</tspan> Lazy Evaluation <tspan fill="#818cf8">•</tspan> Streaming Engines <tspan fill="#c084fc">•</tspan> Disk Spilling
    </text>
  </g>

  <!-- Interactive Pillars / Feature Pills in Foreground -->
  <g transform="translate(600, 260)">
    <!-- Pill 1: Polars & DuckDB -->
    <g transform="translate(-390, 0)">
      <rect x="-85" y="-19" width="170" height="38" rx="19" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5"/>
      <text text-anchor="middle" y="5" fill="#e0f2fe" class="pill-text">⚡ Vectorized &amp; JIT</text>
    </g>

    <!-- Pill 2: Memory-Mapped -->
    <g transform="translate(-130, 0)">
      <rect x="-85" y="-19" width="170" height="38" rx="19" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5"/>
      <text text-anchor="middle" y="5" fill="#e0e7ff" class="pill-text">💾 Zero-Copy Arrow</text>
    </g>

    <!-- Pill 3: Distributed Engines -->
    <g transform="translate(130, 0)">
      <rect x="-85" y="-19" width="170" height="38" rx="19" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.5"/>
      <text text-anchor="middle" y="5" fill="#fae8ff" class="pill-text">🌐 Distributed Clusters</text>
    </g>

    <!-- Pill 4: Billions of Rows -->
    <g transform="translate(390, 0)">
      <rect x="-85" y="-19" width="170" height="38" rx="19" fill="url(#cardGrad)" stroke="#f472b6" stroke-width="1.2" stroke-opacity="0.5"/>
      <text text-anchor="middle" y="5" fill="#fce7f3" class="pill-text">🚀 Billions of Rows</text>
    </g>
  </g>

  <!-- Bottom Accent Border Glow -->
  <rect x="300" y="357" width="600" height="3" rx="1.5" fill="url(#titleGrad)" opacity="0.8" />
</svg>