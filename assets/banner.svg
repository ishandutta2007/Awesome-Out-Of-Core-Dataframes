<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070b14"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#080e1a"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="35%" stop-color="#818cf8"/><stop offset="70%" stop-color="#c084fc"/><stop offset="100%" stop-color="#f472b6"/></linearGradient><linearGradient id="streamGrad1" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".1"/></linearGradient><linearGradient id="streamGrad2" x1="100%" x2="0%" y1="0%" y2="0%"><stop offset="0%" stop-color="#ec4899" stop-opacity=".7"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity=".1"/></linearGradient><linearGradient id="glowGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".25"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".75"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".85"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(1deg)}}@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes streamFlowRight{0%{stroke-dashoffset:400}}@keyframes streamFlowLeft{0%{stroke-dashoffset:-400}}@keyframes nodePulse{0%{transform:scale(1);opacity:.8}50%{transform:scale(1.3);opacity:1}}@keyframes memoryChunkDrift{0%{transform:translateX(0);opacity:.2}50%{opacity:.7}}.bg-pulse-1{animation:pulseGlow 8s ease-in-out infinite;transform-origin:250px 180px}.bg-pulse-2{animation:pulseGlow 10s ease-in-out infinite reverse;transform-origin:950px 180px}.stream-line-1{stroke-dasharray:20,15;animation:streamFlowRight 12s linear infinite}.stream-line-2{stroke-dasharray:16,12;animation:streamFlowLeft 14s linear infinite}.particle-pulse{animation:nodePulse 3s ease-in-out infinite}.chunk-1{animation:memoryChunkDrift 7s cubic-bezier(.4,0,.2,1) infinite}.chunk-2{animation:memoryChunkDrift 9s cubic-bezier(.4,0,.2,1) infinite 2s}.chunk-3{animation:memoryChunkDrift 8s cubic-bezier(.4,0,.2,1) infinite 4s}.title-text{font-weight:800;letter-spacing:-.025em}.pill-text,.sub-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.sub-text{font-weight:500;letter-spacing:.015em}.pill-text{font-weight:600;font-size:13px}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="360" fill="none" stroke="#334155" stroke-opacity=".4" stroke-width="1.5" rx="16"/><circle cx="220" cy="120" r="180" fill="url(#glowGrad)" class="bg-pulse-1" filter="url(#glow)"/><circle cx="980" cy="240" r="210" fill="url(#glowGrad)" class="bg-pulse-2" filter="url(#glow)"/><g opacity=".45"><path fill="none" stroke="url(#streamGrad1)" stroke-width="2.5" d="M -50 80 Q 300 40, 600 90 T 1250 70" class="stream-line-1"/><path fill="none" stroke="url(#streamGrad2)" stroke-width="2.5" d="M -50 290 Q 350 330, 700 280 T 1250 300" class="stream-line-2"/><path fill="none" stroke="#6366f1" stroke-opacity=".35" stroke-width="1.2" d="M -30 190 C 250 140, 450 240, 800 170 S 1100 230, 1230 190" class="stream-line-1"/></g><g opacity=".6"><g class="chunk-1"><rect width="28" height="14" x="180" y="65" fill="#38bdf8" fill-opacity=".6" stroke="#0284c7" stroke-width="1" rx="4"/></g><g class="chunk-2"><rect width="32" height="15" x="100" y="278" fill="#a855f7" fill-opacity=".6" stroke="#9333ea" stroke-width="1" rx="4"/></g><g class="chunk-3"><rect width="24" height="12" x="680" y="55" fill="#ec4899" fill-opacity=".6" stroke="#db2777" stroke-width="1" rx="4"/></g></g><g fill="#475569" opacity=".3"><circle cx="80" cy="50" r="2"/><circle cx="120" cy="50" r="2"/><circle cx="160" cy="50" r="2"/><circle cx="1040" cy="50" r="2"/><circle cx="1080" cy="50" r="2"/><circle cx="1120" cy="50" r="2"/><circle cx="80" cy="310" r="2"/><circle cx="120" cy="310" r="2"/><circle cx="160" cy="310" r="2"/><circle cx="1040" cy="310" r="2"/><circle cx="1080" cy="310" r="2"/><circle cx="1120" cy="310" r="2"/></g><g transform="translate(600, 52)"><rect width="280" height="32" x="-140" y="-16" fill="#1e293b" fill-opacity=".9" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1.2" rx="16"/><circle cx="-118" cy="0" r="5" fill="#38bdf8" class="particle-pulse"/><text y="4.5" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" font-weight="700" letter-spacing=".1em" text-anchor="middle">CURATED DATA ECOSYSTEM</text></g><g><text fill="url(#titleGrad)" class="title-text" filter="url(#softGlow)" font-size="46" text-anchor="middle" transform="translate(600, 138)">Awesome Out-Of-Core DataFrames</text><text fill="url(#titleGrad)" class="title-text" font-size="46" text-anchor="middle" transform="translate(600, 138)">Awesome Out-Of-Core DataFrames</text></g><g><text fill="#94a3b8" class="sub-text" font-size="18" text-anchor="middle" transform="translate(600, 185)">Larger-Than-RAM Processing <tspan fill="#38bdf8">•</tspan> Lazy Evaluation <tspan fill="#818cf8">•</tspan> Streaming Engines <tspan fill="#c084fc">•</tspan> Disk Spilling</text></g><g><g transform="translate(600, 260) translate(-390, 0)"><rect width="170" height="38" x="-85" y="-19" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1.2" rx="19"/><text y="5" fill="#e0f2fe" class="pill-text" text-anchor="middle">⚡ Vectorized &amp; JIT</text></g><g transform="translate(600, 260) translate(-130, 0)"><rect width="170" height="38" x="-85" y="-19" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity=".5" stroke-width="1.2" rx="19"/><text y="5" fill="#e0e7ff" class="pill-text" text-anchor="middle">💾 Zero-Copy Arrow</text></g><g transform="translate(600, 260) translate(130, 0)"><rect width="170" height="38" x="-85" y="-19" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity=".5" stroke-width="1.2" rx="19"/><text y="5" fill="#fae8ff" class="pill-text" text-anchor="middle">🌐 Distributed Clusters</text></g><g transform="translate(600, 260) translate(390, 0)"><rect width="170" height="38" x="-85" y="-19" fill="url(#cardGrad)" stroke="#f472b6" stroke-opacity=".5" stroke-width="1.2" rx="19"/><text y="5" fill="#fce7f3" class="pill-text" text-anchor="middle">🚀 Billions of Rows</text></g></g><rect width="600" height="3" x="300" y="357" fill="url(#titleGrad)" opacity=".8" rx="1.5"/></svg>